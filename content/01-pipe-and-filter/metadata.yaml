numero: "01"
slug: "pipe-and-filter"
titulo: "Pipe and Filter"
subtitulo: "Processamento de dados como fluxo sequencial de transformações independentes"
resumo: >-
  O estilo arquitetural Pipe and Filter organiza o processamento de dados como
  uma cadeia de transformações independentes (filtros) conectadas por canais
  (pipes). Cada filtro recebe uma entrada, aplica uma transformação e produz
  uma saída, sem conhecer os filtros vizinhos. Este tópico analisa a estrutura,
  os trade-offs e os critérios de decisão para adotar ou evitar esse estilo.

